{% comment %}Círculo con la foto de la persona, o sus iniciales si no tiene (o si el archivo ya no está). Uso: {% include 'partials/avatar.html' with person=user cls='lg' %}{% endcomment %}
<div class="avatar{% if cls %} {{ cls }}{% endif %}">{% if person.avatar_url %}<img src="{{ person.avatar_url }}" alt="" loading="lazy" data-initials="{{ person.initials }}" onerror="this.parentNode.textContent = this.dataset.initials">{% else %}{{ person.initials }}{% endif %}</div>
