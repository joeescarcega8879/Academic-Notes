{% load static %}<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ site_name }}{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'css/gradelink.css' %}?v=20" />
  </head>
  <body>
    <main class="auth-shell">
      <a class="auth-brand" href="{% url 'home' %}"><span class="brand-mark">{{ site_name|first }}</span> {{ site_name }}</a>
      <div class="auth-card">
        {% if messages %}
          <div class="flash-list">
            {% for message in messages %}<div class="flash flash-{{ message.level_tag }}" role="status">{{ message }}</div>{% endfor %}
          </div>
        {% endif %}
        {% block content %}{% endblock %}
      </div>
      <p class="auth-foot text-xs">
        <a href="{% url 'terms' %}">Términos</a> · <a href="{% url 'privacy' %}">Privacidad</a> · <a href="mailto:{{ support_email }}">{{ support_email }}</a>
      </p>
    </main>
  </body>
</html>
