{% load static %}
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>
      {% block title %}
        Academic Notes
      {% endblock %}
    </title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      // Aplica el tema guardado antes del primer pintado, para evitar el parpadeo.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('gl-tweaks') || '{}');
          if (saved.theme === 'dark') document.documentElement.classList.add('theme-dark');
          var resolved = saved.resolved || {};
          Object.keys(resolved).forEach(function (k) {
            document.documentElement.style.setProperty(k, resolved[k]);
          });
        } catch (e) { }
      })();
    </script>
    <link rel="stylesheet" href="{% static 'css/gradelink.css' %}" />

  </head>
  <body data-grade-style="pill">

    {% if user.is_authenticated %}
    <button id="nav-toggle" class="nav-toggle" type="button" title="Menú" aria-label="Abrir menú"><i data-icon="menu"></i></button>
    <div class="nav-scrim" id="nav-scrim"></div>
    {% endif %}
    
    <div class="app">
      {% include 'partials/sidebar.html' %}

      <main class="main">
        {% block topbar %}

        {% endblock %}
        
        <div class="content">
          {% block content %}
          
          {% endblock %}
        </div>
      </main>
    </div>

    {% include 'partials/modals.html' %}

    <button id="tweaks-fab" class="tweaks-fab" title="Tweaks"><i data-icon="settings"></i></button>

    <aside class="tweaks-panel" id="tweaks-panel">
      <header class="tweaks-head">
        <h4>Tweaks</h4>
        <button id="tweaks-close" aria-label="Cerrar"><i data-icon="x"></i></button>
      </header>
      <div class="tweaks-body" id="tweaks-body"></div>
    </aside>

    <script src="{% static 'js/icons.js' %}"></script>
    <script src="{% static 'js/app.js' %}"></script>
  </body>
</html>
