{% load static %}<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ site_name }}{% endblock %}</title>
    {% block meta %}{% endblock %}
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'css/portada.css' %}?v=4" />
  </head>
  <body class="portada">
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-logo" viewBox="0 0 34 34"><rect width="34" height="34" rx="10" fill="#1e3a5f"/><rect x="8" y="7" width="18" height="21" rx="3" fill="#fff"/><path d="M12 18l3.6 3.6L22 14" fill="none" stroke="#2ecc71" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="12" y="10" width="10" height="2" rx="1" fill="#1e3a5f" opacity=".35"/></symbol>
    </svg>
    <a class="skip" href="#contenido">Saltar al contenido</a>

    {% include 'onboarding/_cabecera.html' %}

    <main id="contenido">
      {% block main %}{% endblock %}
    </main>

    {% include 'onboarding/_pie.html' %}
    {% block scripts %}{% endblock %}
  </body>
</html>
